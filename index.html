<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("portfolio-theme");
          const theme =
            savedTheme === "light" || savedTheme === "dark"
              ? savedTheme
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";

          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <!--=============== REMIXICON ===============-->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="assets/css/styles.css" />

    <title>Portfolio</title>
  </head>
  <body>
    <!--=============== HEADER ===============-->
    <header class="header">
      <nav class="nav container">
        <a href="#home" class="nav-logo">Henrique Freitas</a>

        <div class="nav-menu" id="nav-menu">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#home" class="nav-link">Home</a>
            </li>
            <li class="nav-item">
              <a href="#about" class="nav-link">About</a>
            </li>
            <li class="nav-item">
              <a href="#skills" class="nav-link">Skills</a>
            </li>
            <li class="nav-item">
              <a href="#projects" class="nav-link">Projects</a>
            </li>
            <li class="nav-item">
              <a href="#contact" class="nav-link">Contact</a>
            </li>
          </ul>

          <button class="nav-close" type="button" aria-label="Close menu">
            <i class="ri-close-line" aria-hidden="true"></i>
          </button>
        </div>

        <div class="nav-actions">
          <button class="theme-toggle" type="button" aria-label="Switch theme">
            <i class="ri-sun-line" aria-hidden="true"></i>
          </button>

          <button
            class="nav-toggle"
            type="button"
            aria-label="Open menu"
            aria-controls="nav-menu"
            aria-expanded="false"
          >
            <i class="ri-menu-line" aria-hidden="true"></i>
          </button>
        </div>
      </nav>
    </header>

    <!--=============== MAIN ===============-->
    <main class="main">
      <!--=============== HOME ===============-->
      <section class="home section" id="home">
        <div class="home-container container grid">
          <div class="home-data">
            <h1 class="home-title">Henrique Freitas</h1>
            <h3 class="home-job">I'm a Backend Developer</h3>

            <p class="home-description">I don't know the text yet.</p>
          </div>
          <div class="home-img-wrapper">
            <img src="assets/img/profile.png" alt="" class="home-img" />
          </div>
          <div class="home-social grid">
            <a
              href="https://www.linkedin.com/in/louishb7/"
              target="_blank"
              class="home-social-link"
            >
              <i class="ri-linkedin-fill"></i>
            </a>

            <a
              href="https://github.com/louishb7"
              target="_blank"
              class="home-social-link"
            >
              <i class="ri-github-fill"></i>
            </a>
          </div>
        </div>
      </section>

      <!--=============== ABOUT ===============-->
      <section class="about section" id="about">
        <div class="about-container container grid">
          <div>
            <h2 class="about-description">
              Over <span class="text-gradient">6 Month of studying</span>, I've
              been building some really good projects
              <span class="text-gradient">to show my skills</span>
            </h2>
            <a href="assets/pdf/henrique_cv.pdf" download="" class="button">
              Download CV
            </a>
          </div>
        </div>
      </section>

      <!--=============== SKILLS ===============-->
      <section class="skills section" id="skills">
        <h2 class="section-title">My Skills</h2>
      </section>

      <!--=============== PROJECTS ===============-->
      <section class="projects section" id="projects">
        <h2 class="section-title">Projects</h2>
      </section>

      <!--=============== CONTACT ===============-->
      <section class="contact section" id="contact"></section>
    </main>

    <!--=============== FOOTER ===============-->
    <footer class="footer"></footer>

    <!--=============== GSAP ===============-->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>

    <!--=============== MAIN JS ===============-->
    <script src="assets/js/main.js"></script>
  </body>
</html>
