<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--=============== REMIXICON ===============-->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="assets/css/styles.css" />

    <title>Portfolio website zethan</title>
  </head>
  <body>
    <!--=============== HEADER ===============-->
    <header class="header">
      <nav class="nav container">
        <a href="#" class="nav-logo">Henrique Freitas</a>

        <div class="nav-menu">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#" class="nav-link active-link">Home</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">About</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Services</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Skills</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Portfolio</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Contact</a>
            </li>
          </ul>

          <i class="ri-close-line nav-close"></i>
        </div>

        <div class="nav-btns">
          <i class="ri-sun-line change-theme"></i>

          <div class="nav-toggle">
            <i class="ri-menu-line"></i>
          </div>
        </div>
      </nav>
    </header>

    <!--=============== MAIN ===============-->
    <main class="main">
      <!--=============== HOME ===============-->
      <section class="home section" id="home">
        <div class="home-container container grid">
          <div class="home-data">
            <h1 class="home-tittle">Henrique Freitas</h1>
            <h3 class="home-job">I'm a Backend Developer</h3>

            <p class="home-description">I don't know the text yet.</p>

            <a href="#" class="button">My works</a>
          </div>
          <div class="home-img-wrapper">
            <img src="assets/img/profile.png" alt="" class="home-img" />
          </div>
          <div class="home-social grid">
            <a
              href="https://www.linkedin.com/in/louishb7/"
              target="_blank"
              class="home-social-link"
            >
              <i class="ri-linkedin-fill"></i>
            </a>

            <a
              href="https://instagram.com/"
              target="_blank"
              class="home-social-link"
            >
              <i class="ri-instagram-line"></i>
            </a>
            <a
              href="https://github.com/louishb7"
              target="_blank"
              class="home-social-link"
            >
              <i class="ri-github-fill"></i>
            </a>
          </div>
        </div>
      </section>

      <!--=============== ABOUT ===============-->
      <section class="about section" id="about"></section>

      <!--=============== SERVICES ===============-->
      <section class="services section" id="services"></section>

      <!--=============== SKILLS ===============-->
      <section class="skills section" id="skills"></section>

      <!--=============== RESUME ===============-->
      <section class="resume section"></section>

      <!--=============== PORTFOLIO ===============-->
      <section class="work section" id="works"></section>

      <!--=============== CONTACT ===============-->
      <section class="contact section" id="contact"></section>
    </main>

    <!--=============== FOOTER ===============-->
    <footer class="footer"></footer>

    <!--=============== GSAP ===============-->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

    <!--=============== COUNT-UP ===============-->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/lekoala/formidable-elements@master/dist/count-up.min.js"
    ></script>

    <!--=============== MIXITUP ===============-->
    <script src="assets/js/mixitup.min.js"></script>

    <!--=============== EMAIL JS ===============-->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
    ></script>

    <!--=============== SCROLL REVEAL ===============-->
    <script src="https://unpkg.com/scrollreveal"></script>

    <!--=============== MAIN JS ===============-->
    <script src="assets/js/main.js"></script>
  </body>
</html>
